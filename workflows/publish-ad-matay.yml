name: Publish BDALAK site + Ad Matay

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'ad-matay-v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare existing website
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='ad-matay/' ./ "$RUNNER_TEMP/site/"
          test -f "$RUNNER_TEMP/site/index.html" || { echo 'Missing website index.html'; exit 1; }
          test -f "$RUNNER_TEMP/site/CNAME" || printf 'bdalak-gaming.co.il\n' > "$RUNNER_TEMP/site/CNAME"
      - name: Find game release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("ad-matay-v")))] | first | .tag_name')"
          fi
          if [[ -z "$TAG" || "$TAG" == null ]]; then echo 'No published ad-matay-v* release found'; exit 1; fi
          echo "Publishing $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'ad-matay-web.zip' --dir "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/ad-matay-web.zip" || { echo 'Release is missing ad-matay-web.zip'; exit 1; }
          unzip -q "$RUNNER_TEMP/ad-matay-web.zip" -d "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/ad-matay/index.html" || { echo 'Missing game index.html inside ZIP'; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
